name: Repair runner newlines
on:
  push:
    paths:
      - '.github/workflows/fix-runner-newlines.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped newlines and validate syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/peixao/runner.py')
          s = p.read_text()
          s = s.replace('\\n', '\n')
          p.write_text(s)
          compile(s, str(p), 'exec')
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/peixao/runner.py
          git diff --cached --quiet || git commit -m 'fix: repair runner literal newline escapes'
          git push
